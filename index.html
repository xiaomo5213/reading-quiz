<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>阅读判断 · 在线练习</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f2f5f9;
      padding: 12px 10px 40px;
      color: #1e2b3c;
      line-height: 1.7;
    }
    .app {
      max-width: 800px;
      margin: 0 auto;
    }
    /* 顶部行：考期标题 + 翻译按钮 */
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: nowrap;
    }
    .exam-title-top {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0b2b42;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subhead {
      font-size: 0.82rem;
      color: #5b6f82;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 0 2px;
    }
    .subhead span {
      background: #d9e2ec;
      padding: 2px 9px;
      border-radius: 30px;
      font-size: 0.75rem;
      color: #1e2b3c;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 14px;
      box-shadow: 0 4px 14px rgba(0, 20, 30, 0.04);
      margin-bottom: 14px;
    }
    .passage {
      background: transparent;
      border-radius: 0;
      padding: 0;
      margin-bottom: 12px;
      border: none;
      font-size: 1rem;
    }
    .passage-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0b2b42;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #c7d9e9;
    }
    .paragraph {
      margin-bottom: 14px;
      text-align: justify;
      text-justify: inter-ideograph;
      word-break: break-word;
    }
    .paragraph:last-child {
      margin-bottom: 0;
    }
    .paragraph-text {
      color: #0a1f2e;
      font-weight: 500;
      transition: background 0.3s;
      border-radius: 6px;
      line-height: 1.85;
    }
    .paragraph-text .highlight-source {
      background-color: #fff3bf !important;
      box-shadow: 0 0 0 2px #f0d77b;
      border-radius: 6px;
      padding: 2px 4px;
      margin: 0 -4px;
    }

    /* 翻译模式：不同段落不同柔和背景色 */
    .trans-para {
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      transition: background 0.3s;
    }
    .trans-para:last-child {
      margin-bottom: 0;
    }
    .trans-para.color-0 { background: #f0f7ff; }
    .trans-para.color-1 { background: #f3faf0; }
    .trans-para.color-2 { background: #fff9f0; }
    .trans-para.color-3 { background: #f9f2ff; }
    .trans-para.color-4 { background: #effcfc; }
    .trans-para .paragraph {
      margin-bottom: 0;
    }

    .paragraph .en {
      color: #0a1f2e;
      font-weight: 500;
      transition: background 0.3s, box-shadow 0.3s;
      border-radius: 6px;
      padding: 2px 4px;
      margin: 0 -4px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .paragraph .en .en-text {
      flex: 1;
      word-break: break-word;
    }
    .paragraph .zh {
      color: #2b5e7e;
      font-size: 0.93rem;
      margin-top: 6px;
      padding-left: 12px;
      border-left: 3px solid #9bb7d0;
    }
    .zh.hidden {
      display: none;
    }

    /* 发音按钮 */
    .speak-btn {
      flex-shrink: 0;
      background: #eef4fa;
      border: 1px solid #c7d9e9;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      color: #136b9c;
      transition: all 0.15s;
      margin-top: 2px;
      user-select: none;
    }
    .speak-btn:active {
      background: #d0e2f2;
      transform: scale(0.92);
    }
    .speak-btn.speaking {
      background: #136b9c;
      color: #fff;
      border-color: #136b9c;
    }

    .highlight-source {
      background-color: #fff3bf !important;
      box-shadow: 0 0 0 2px #f0d77b;
    }

    /* 翻译按钮 */
    .translate-btn {
      background: #eef4fa;
      border: 1px solid #c7d9e9;
      padding: 5px 14px;
      border-radius: 40px;
      font-size: 0.82rem;
      font-weight: 500;
      color: #136b9c;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .translate-btn:active {
      background: #d6e3f0;
    }

    /* 试题列表 */
    .question-list {
      margin-top: 4px;
    }
    .question-item {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #e4ecf3;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: background 0.3s;
    }
    .question-item.submitted.color-0 { background: #f0f7ff; border-color: #d4e6f5; }
    .question-item.submitted.color-1 { background: #f3faf0; border-color: #d9ecd4; }
    .question-item.submitted.color-2 { background: #fff9f0; border-color: #f5e5cc; }
    .question-item.submitted.color-3 { background: #f9f2ff; border-color: #e8d9f5; }
    .question-item.submitted.color-4 { background: #effcfc; border-color: #cceaea; }

    .q-title {
      font-weight: 600;
      font-size: 0.98rem;
      margin-bottom: 6px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .q-num {
      background: rgba(226,236,246,0.9);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.78rem;
      color: #1b4f72;
    }
    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 6px 0 4px;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.93rem;
      background: #f2f7fc;
      padding: 5px 14px;
      border-radius: 40px;
      border: 1px solid #d4e0eb;
      cursor: pointer;
      transition: all 0.1s;
    }
    .options label.selected {
      background: #cfe4f5;
      border-color: #3b8fc2;
    }
    .options input[type="radio"] {
      accent-color: #1f7bb0;
      width: 15px;
      height: 15px;
      margin-right: 2px;
    }
    .question-item.submitted .options label {
      background: rgba(255,255,255,0.7);
      border-color: rgba(0,0,0,0.06);
    }
    .question-item.submitted .options label.selected {
      background: #cfe4f5;
      border-color: #3b8fc2;
    }

    .explain {
      background: rgba(255,255,255,0.6);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 0.9rem;
      color: #1f4662;
      display: none;
    }
    .explain.show {
      display: block;
    }
    .answer-tag {
      font-weight: 600;
      background: rgba(217,235,247,0.85);
      padding: 2px 10px;
      border-radius: 30px;
      margin-right: 8px;
      font-size: 0.83rem;
      display: inline-block;
    }
    .correct-answer {
      color: #1a6f3c;
      font-weight: 600;
    }
    .wrong-answer {
      color: #b13e3e;
      font-weight: 600;
    }

    .source-btn {
      background: rgba(232,240,250,0.9);
      border: 1px solid #b8cde0;
      padding: 5px 16px;
      border-radius: 40px;
      font-size: 0.83rem;
      font-weight: 500;
      color: #136b9c;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .source-btn:active {
      background: #d0e2f2;
    }
    .source-btn.active {
      background: #136b9c;
      color: white;
      border-color: #136b9c;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      gap: 12px;
    }
    .page-btn {
      background: #ffffff;
      border: 1px solid #c4d5e3;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e4a6e;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.02);
      flex: 0 1 auto;
    }
    .page-btn:active {
      background: #e3eef9;
    }
    .page-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .submit-btn {
      background: #1e6d9e;
      color: white;
      border: none;
      padding: 12px 26px;
      border-radius: 50px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      box-shadow: 0 5px 12px rgba(27, 96, 142, 0.2);
      flex: 1;
      text-align: center;
      width: 100%;
      margin-top: 6px;
    }
    .submit-btn:active {
      background: #155a83;
    }
    .score-banner {
      background: #1e6d9e;
      color: white;
      border-radius: 40px;
      padding: 12px 22px;
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .score-banner span:last-child {
      background: rgba(255,255,255,0.2);
      padding: 4px 16px;
      border-radius: 40px;
    }
    .hidden {
      display: none !important;
    }
    .footnote {
      text-align: center;
      font-size: 0.75rem;
      color: #7b8f9f;
      margin-top: 22px;
    }

    /* 手机端：标题更小，避免挤压翻译按钮 */
    @media (max-width: 480px) {
      .exam-title-top {
        font-size: 0.85rem;
        max-width: 55%;
      }
      .translate-btn {
        font-size: 0.78rem;
        padding: 4px 12px;
      }
    }

    /* ========== 电脑端（宽屏 >= 900px）两栏布局 ========== */
    @media (min-width: 900px) {
      body {
        padding: 16px 20px 40px;
      }
      .app {
        max-width: 1400px;
      }
      .two-col {
        display: flex;
        gap: 22px;
        align-items: flex-start;
      }
      .col-left {
        flex: 1 1 55%;
        position: sticky;
        top: 16px;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding-right: 4px;
      }
      .col-right {
        flex: 1 1 45%;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding-right: 4px;
      }
      .col-left::-webkit-scrollbar,
      .col-right::-webkit-scrollbar {
        width: 6px;
      }
      .col-left::-webkit-scrollbar-track,
      .col-right::-webkit-scrollbar-track {
        background: #eef4fa;
        border-radius: 10px;
      }
      .col-left::-webkit-scrollbar-thumb,
      .col-right::-webkit-scrollbar-thumb {
        background: #b8cde0;
        border-radius: 10px;
      }
      .col-left::-webkit-scrollbar-thumb:hover,
      .col-right::-webkit-scrollbar-thumb:hover {
        background: #8fb2cd;
      }
      .col-left .card,
      .col-right .card {
        margin-bottom: 14px;
      }
      .col-left .passage {
        margin-bottom: 0;
      }
      .pagination-wrapper {
        max-width: 1400px;
        margin: 0 auto;
      }
      .pagination {
        justify-content: center;
        gap: 24px;
      }
      .col-left .card {
        padding: 16px 18px;
      }
      /* 电脑端标题更大一些 */
      .exam-title-top {
        font-size: 1.05rem;
      }
    }

    /* 手机端 */
    @media (max-width: 899px) {
      .two-col {
        display: block;
      }
      .col-left, .col-right {
        max-height: none;
        overflow: visible;
        position: static;
      }
      .pagination-wrapper {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">⏳ 正在加载题库...</div>
</div>
<script>
  let exams = [];
  let currentExamIndex = 0;
  let userAnswers = {};
  let submitted = {};
  let showTranslation = {};
  let activeSourceKey = null;
  let currentSpeakBtn = null;

  function initUserAnswers() {
    exams.forEach(exam => {
      exam.questions.forEach((_, idx) => {
        const key = `${exam.id}_${idx}`;
        if (!(key in userAnswers)) userAnswers[key] = null;
      });
      if (!(exam.id in submitted)) submitted[exam.id] = false;
      if (!(exam.id in showTranslation)) showTranslation[exam.id] = false;
    });
  }

  function buildFlatSentences() {
    exams.forEach(exam => {
      exam.flatSentences = [];
      exam.paragraphs.forEach(p => p.sentences.forEach(s => exam.flatSentences.push(s)));
    });
  }

  function getParagraphStartIndex(exam, pIdx) {
    let start = 0;
    for (let i = 0; i < pIdx; i++) {
      start += exam.paragraphs[i].sentences.length;
    }
    return start;
  }

  function speakText(text, btnEl) {
    if (currentSpeakBtn) {
      currentSpeakBtn.classList.remove('speaking');
      if (currentSpeakBtn._stopSpeech) {
        try { currentSpeakBtn._stopSpeech(); } catch (e) {}
        currentSpeakBtn._stopSpeech = null;
      }
      if (currentSpeakBtn === btnEl) {
        currentSpeakBtn = null;
        return;
      }
      currentSpeakBtn = null;
    }
    if (btnEl) {
      btnEl.classList.add('speaking');
      currentSpeakBtn = btnEl;
    }
    if (window.speechSynthesis) {
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1;
        utterance.onend = () => {
          if (btnEl) btnEl.classList.remove('speaking');
          if (currentSpeakBtn === btnEl) currentSpeakBtn = null;
        };
        utterance.onerror = () => {
          if (btnEl) btnEl.classList.remove('speaking');
          if (currentSpeakBtn === btnEl) currentSpeakBtn = null;
          fallbackOnlineTTS(text, btnEl);
        };
        if (btnEl) {
          btnEl._stopSpeech = () => { window.speechSynthesis.cancel(); };
        }
        window.speechSynthesis.speak(utterance);
        return;
      } catch (e) {
        console.warn('SpeechSynthesis exception, fallback:', e);
      }
    }
    fallbackOnlineTTS(text, btnEl);
  }

  function fallbackOnlineTTS(text, btnEl) {
    const encodedText = encodeURIComponent(text);
    const url = `https://tts.youdao.com/fanyivoice?word=${encodedText}&le=eng&keyfrom=speaker-target`;
    const audio = new Audio(url);
    audio.play().catch((err) => {
      console.warn('在线 TTS 播放失败:', err);
      if (btnEl) {
        btnEl.classList.remove('speaking');
        if (currentSpeakBtn === btnEl) currentSpeakBtn = null;
      }
    });
    if (btnEl) {
      btnEl._stopSpeech = () => {
        audio.pause();
        audio.currentTime = 0;
      };
    }
    audio.onended = () => {
      if (btnEl) btnEl.classList.remove('speaking');
      if (currentSpeakBtn === btnEl) currentSpeakBtn = null;
    };
    audio.onerror = () => {
      if (btnEl) btnEl.classList.remove('speaking');
      if (currentSpeakBtn === btnEl) currentSpeakBtn = null;
    };
  }

  const app = document.getElementById('app');

  function render() {
    if (!exams.length) {
      app.innerHTML = '<div class="loading">⚠️ 题库数据为空，请检查 data.json</div>';
      return;
    }
    const exam = exams[currentExamIndex];
    const examId = exam.id;
    const isSubmitted = submitted[examId];
    const translationOn = showTranslation[examId];

    let score = 0;
    exam.questions.forEach((q, idx) => {
      const userAns = userAnswers[`${examId}_${idx}`];
      if (userAns === q.answer) score++;
    });

    const highlightIndices = new Set();
    if (isSubmitted && activeSourceKey && activeSourceKey.startsWith(examId)) {
      const idx = parseInt(activeSourceKey.split('_')[1], 10);
      const q = exam.questions[idx];
      if (q && q.sourceIndices) {
        q.sourceIndices.forEach(i => highlightIndices.add(i));
      }
    }

    // ========== 左侧阅读材料 ==========
    let passageHtml = '';
    passageHtml += `<div class="card">`;

    // 顶部行：考期标题 + 翻译按钮
    passageHtml += `<div class="top-row">`;
    passageHtml += `<div class="exam-title-top">${exam.title}</div>`;
    passageHtml += `<button class="translate-btn" id="translateToggle"><i>🌐</i> ${translationOn ? '隐藏翻译' : '显示翻译'}</button>`;
    passageHtml += `</div>`;

    passageHtml += `<div class="passage">`;
    passageHtml += `<div class="passage-title">${exam.subtitle}</div>`;

    if (translationOn) {
      exam.paragraphs.forEach((para, pIdx) => {
        const colorClass = `color-${pIdx % 5}`;
        passageHtml += `<div class="trans-para ${colorClass}">`;
        para.sentences.forEach((sent, sIdx) => {
          const idx = getParagraphStartIndex(exam, pIdx) + sIdx;
          const isHighlight = highlightIndices.has(idx);
          passageHtml += `<div class="paragraph"><div class="en ${isHighlight ? 'highlight-source' : ''}" id="sent-${examId}-${idx}">`;
          passageHtml += `<span class="en-text">${sent.en}</span>`;
          passageHtml += `<span class="speak-btn" data-text="${encodeURIComponent(sent.en)}" title="发音">🔊</span>`;
          passageHtml += `</div>`;
          passageHtml += `<div class="zh">${sent.zh}</div></div>`;
        });
        passageHtml += `</div>`;
      });
    } else {
      exam.paragraphs.forEach((para, pIdx) => {
        const startIdx = getParagraphStartIndex(exam, pIdx);
        passageHtml += `<div class="paragraph">`;
        let paraHtml = '';
        para.sentences.forEach((sent, sIdx) => {
          const idx = startIdx + sIdx;
          const isHighlight = highlightIndices.has(idx);
          const space = sIdx > 0 ? ' ' : '';
          if (isHighlight) {
            paraHtml += `${space}<span class="highlight-source" id="sent-${examId}-${idx}">${sent.en}</span>`;
          } else {
            paraHtml += `${space}<span id="sent-${examId}-${idx}">${sent.en}</span>`;
          }
        });
        passageHtml += `<div class="paragraph-text">${paraHtml}</div>`;
        passageHtml += `</div>`;
      });
    }
    passageHtml += `</div>`;
    passageHtml += `</div>`;

    // ========== 右侧试题 ==========
    let questionsHtml = '';
    questionsHtml += `<div class="subhead"><span>每小题1分</span><span>共10题</span><span>满分10分</span></div>`;
    questionsHtml += `<div class="card">`;

    questionsHtml += `<div class="question-list">`;
    exam.questions.forEach((q, idx) => {
      const qKey = `${examId}_${idx}`;
      const userAns = userAnswers[qKey];
      const isCorrect = isSubmitted && (userAns === q.answer);
      const isWrong = isSubmitted && userAns && (userAns !== q.answer);
      const answerDisplay = q.answer;
      const hasSource = q.sourceIndices && q.sourceIndices.length > 0;
      const isActive = activeSourceKey === qKey;
      const questionColorClass = isSubmitted ? `submitted color-${idx % 5}` : '';

      questionsHtml += `<div class="question-item ${questionColorClass}" data-qidx="${idx}">`;
      questionsHtml += `<div class="q-title"><span class="q-num">Q${idx + 1}</span> ${q.q}</div>`;
      questionsHtml += `<div class="options">`;
      const optionLabels = { A: 'A. True', B: 'B. False', C: 'C. Not Given' };
      ['A', 'B', 'C'].forEach(opt => {
        const checked = (userAns === opt) ? 'checked' : '';
        const selectedClass = (userAns === opt) ? 'selected' : '';
        const disabled = isSubmitted ? 'disabled' : '';
        questionsHtml += `<label class="${selectedClass}"><input type="radio" name="q_${examId}_${idx}" value="${opt}" ${checked} ${disabled}> ${optionLabels[opt]}</label>`;
      });
      questionsHtml += `</div>`;

      if (isSubmitted) {
        questionsHtml += `<div class="explain show" id="explain_${examId}_${idx}">`;
        questionsHtml += `<div><span class="answer-tag">正确答案: ${answerDisplay}</span>`;
        if (userAns) {
          questionsHtml += `<span class="${isCorrect ? 'correct-answer' : 'wrong-answer'}">你的答案: ${userAns} ${isCorrect ? '✓' : '✗'}</span>`;
        } else {
          questionsHtml += `<span class="wrong-answer">未作答</span>`;
        }
        questionsHtml += `</div>`;
        questionsHtml += `<div style="margin-top:6px;"><strong>解析：</strong>${q.explain}</div>`;
        if (hasSource) {
          questionsHtml += `<button class="source-btn ${isActive ? 'active' : ''}" data-qkey="${qKey}">📍 ${isActive ? '取消来源' : '答案来源'}</button>`;
        }
        questionsHtml += `</div>`;
      }
      questionsHtml += `</div>`;
    });
    questionsHtml += `</div>`;

    if (!isSubmitted) {
      questionsHtml += `<button class="submit-btn" id="submitBtn">提交答案</button>`;
    } else {
      questionsHtml += `<div class="score-banner"><span>📋 得分</span><span>${score} / 10</span></div>`;
      questionsHtml += `<button class="submit-btn" id="resetBtn" style="background:#5b7f9c;">重新作答</button>`;
    }
    questionsHtml += `</div>`;

    // ========== 整体结构 ==========
    let html = '';
    html += `<div class="two-col">`;
    html += `<div class="col-left" id="colLeft">${passageHtml}</div>`;
    html += `<div class="col-right" id="colRight">${questionsHtml}</div>`;
    html += `</div>`;

    html += `<div class="pagination-wrapper">`;
    html += `<div class="pagination">`;
    html += `<button class="page-btn" id="prevBtn" ${currentExamIndex === 0 ? 'disabled' : ''}>← 上一页</button>`;
    html += `<button class="page-btn" id="nextBtn" ${currentExamIndex === exams.length - 1 ? 'disabled' : ''}>下一页 →</button>`;
    html += `</div>`;
    html += `</div>`;

    html += `<div class="footnote">© 在线练习</div>`;

    app.innerHTML = html;
    bindCommonEvents(exam, examId, isSubmitted, translationOn);
    bindSpeakButtons();

    if (highlightIndices.size > 0) {
      const firstIdx = Math.min(...highlightIndices);
      const el = document.getElementById(`sent-${examId}-${firstIdx}`);
      if (el) {
        setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
      }
    }
  }

  function bindSpeakButtons() {
    document.querySelectorAll('.speak-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const text = decodeURIComponent(btn.dataset.text || '');
        if (text) speakText(text, btn);
      });
    });
  }

  function bindCommonEvents(exam, examId, isSubmitted, translationOn) {
    const transBtn = document.getElementById('translateToggle');
    if (transBtn) {
      transBtn.addEventListener('click', () => {
        if (currentSpeakBtn) {
          currentSpeakBtn.classList.remove('speaking');
          if (currentSpeakBtn._stopSpeech) {
            try { currentSpeakBtn._stopSpeech(); } catch (e) {}
            currentSpeakBtn._stopSpeech = null;
          }
          currentSpeakBtn = null;
        }
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        showTranslation[examId] = !showTranslation[examId];
        render();
      });
    }

    if (!translationOn && !isSubmitted) {
      exam.questions.forEach((_, idx) => {
        const radios = document.getElementsByName(`q_${examId}_${idx}`);
        radios.forEach(radio => {
          radio.addEventListener('change', (e) => {
            const val = e.target.value;
            const qKey = `${examId}_${idx}`;
            userAnswers[qKey] = val;
            const parentDiv = e.target.closest('.options');
            if (parentDiv) {
              parentDiv.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
              e.target.closest('label').classList.add('selected');
            }
          });
        });
      });
    }

    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn && !translationOn && !isSubmitted) {
      submitBtn.addEventListener('click', () => {
        let allAnswered = true;
        for (let i = 0; i < exam.questions.length; i++) {
          if (!userAnswers[`${examId}_${i}`]) { allAnswered = false; break; }
        }
        if (!allAnswered) { alert('请先完成所有题目再提交。'); return; }
        submitted[examId] = true;
        activeSourceKey = null;
        render();
      });
    }

    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn && !translationOn) {
      resetBtn.addEventListener('click', () => {
        exam.questions.forEach((_, idx) => { userAnswers[`${examId}_${idx}`] = null; });
        submitted[examId] = false;
        activeSourceKey = null;
        render();
      });
    }

    if (!translationOn && isSubmitted) {
      document.querySelectorAll('.source-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const qKey = e.currentTarget.dataset.qkey;
          if (!qKey) return;
          if (activeSourceKey === qKey) { activeSourceKey = null; }
          else { activeSourceKey = qKey; }
          render();
        });
      });
    }

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        if (currentExamIndex > 0) {
          currentExamIndex--;
          activeSourceKey = null;
          if (currentSpeakBtn) { currentSpeakBtn.classList.remove('speaking'); if (currentSpeakBtn._stopSpeech) { try { currentSpeakBtn._stopSpeech(); } catch (e) {} } currentSpeakBtn = null; }
          if (window.speechSynthesis) window.speechSynthesis.cancel();
          render();
        }
      });
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        if (currentExamIndex < exams.length - 1) {
          currentExamIndex++;
          activeSourceKey = null;
          if (currentSpeakBtn) { currentSpeakBtn.classList.remove('speaking'); if (currentSpeakBtn._stopSpeech) { try { currentSpeakBtn._stopSpeech(); } catch (e) {} } currentSpeakBtn = null; }
          if (window.speechSynthesis) window.speechSynthesis.cancel();
          render();
        }
      });
    }
  }

  fetch('./data.json')
    .then(res => { if (!res.ok) throw new Error('无法加载 data.json'); return res.json(); })
    .then(data => {
      exams = data;
      buildFlatSentences();
      initUserAnswers();
      render();
    })
    .catch(err => {
      console.error('加载数据失败:', err);
      app.innerHTML = '<div class="loading">❌ 数据加载失败，请确认 data.json 文件存在且格式正确。<br><br>' + err.message + '</div>';
    });
</script>
</body>
</html>
